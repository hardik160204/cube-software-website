<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-label="Cube telephony integrated with CRM" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3B82F6" stop-opacity=".55"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DB8FF"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9z" fill="#34D399"/></marker>
  </defs>

  <!-- glow + rings -->
  <circle cx="320" cy="280" r="230" fill="url(#glow)"/>
  <circle cx="320" cy="280" r="200" fill="none" stroke="#60A5FA" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 10" stroke-linecap="round"/>
  <circle cx="320" cy="280" r="150" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>

  <!-- connectors -->
  <g fill="none" stroke="#60A5FA" stroke-opacity=".7" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9">
    <path d="M200 175C225 200 235 215 262 238"/>
    <path d="M440 365C420 350 405 340 385 328"/>
    <path d="M496 128C460 160 430 195 395 232"/>
    <path d="M118 380C160 350 205 330 252 315"/>
  </g>

  <!-- sync arcs -->
  <g fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-opacity=".9">
    <path d="M229 233A105 105 0 0 1 405 227" marker-end="url(#ah)"/>
    <path d="M411 337A105 105 0 0 1 235 343" marker-end="url(#ah)"/>
  </g>

  <!-- cube -->
  <g id="cube">
    <path d="M320 195L390 235L320 275L250 235Z" fill="url(#top)"/>
    <path d="M250 235L320 275V365L250 325Z" fill="url(#left)"/>
    <path d="M390 235L320 275V365L390 325Z" fill="url(#right)"/>
    <path d="M250 235L320 275L390 235M320 275V365" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linejoin="round"/>
    <!-- headset on top -->
    <g transform="matrix(.866 .5 -.866 .5 320 235) scale(.5)" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round">
      <path d="M-30 6V-6a30 30 0 0 1 60 0V6"/>
      <rect x="-40" y="2" width="16" height="28" rx="7" fill="#fff" stroke="none"/>
      <rect x="24" y="2" width="16" height="28" rx="7" fill="#fff" stroke="none"/>
      <path d="M32 30c0 12-10 16-26 16" stroke="#FBBF24"/>
    </g>
    <!-- left face: dialer dots -->
    <g transform="matrix(.866 .5 0 1 285 320)" fill="#fff">
      <circle cx="-14" cy="-12" r="4"/><circle cx="0" cy="-12" r="4"/><circle cx="14" cy="-12" r="4"/>
      <circle cx="-14" cy="2" r="4"/><circle cx="0" cy="2" r="4"/><circle cx="14" cy="2" r="4"/>
      <rect x="-16" y="16" width="32" height="10" rx="5" fill="#FBBF24"/>
    </g>
    <!-- right face: contact -->
    <g transform="matrix(.866 -.5 0 1 355 320)" fill="#fff">
      <circle cx="-12" cy="-10" r="9"/>
      <path d="M-26 16a14 12 0 0 1 28 0z"/>
      <rect x="8" y="-16" width="20" height="6" rx="3"/>
      <rect x="8" y="-4" width="14" height="6" rx="3" opacity=".7"/>
    </g>
  </g>

  <!-- CRM dashboard card -->
  <g id="crm-card">
    <rect x="40" y="70" width="190" height="130" rx="16" fill="#fff" fill-opacity=".08" stroke="#60A5FA" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="74" cy="104" r="16" fill="#34D399"/>
    <circle cx="74" cy="99" r="5" fill="#fff"/><path d="M65 114a9 7 0 0 1 18 0z" fill="#fff"/>
    <rect x="100" y="94" width="84" height="8" rx="4" fill="#fff" fill-opacity=".75"/>
    <rect x="100" y="110" width="56" height="6" rx="3" fill="#fff" fill-opacity=".35"/>
    <g fill="#60A5FA"><rect x="62" y="156" width="16" height="24" rx="4"/><rect x="88" y="142" width="16" height="38" rx="4"/><rect x="114" y="150" width="16" height="30" rx="4"/></g>
    <rect x="140" y="132" width="16" height="48" rx="4" fill="#34D399"/>
    <path d="M62 146L92 132L120 138L150 118L204 124" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- call card -->
  <g id="call-card">
    <rect x="410" y="360" width="190" height="120" rx="16" fill="#fff" fill-opacity=".08" stroke="#34D399" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="444" cy="394" r="16" fill="#60A5FA"/>
    <circle cx="444" cy="389" r="5" fill="#fff"/><path d="M435 404a9 7 0 0 1 18 0z" fill="#fff"/>
    <rect x="470" y="384" width="66" height="8" rx="4" fill="#fff" fill-opacity=".75"/>
    <rect x="470" y="400" width="44" height="6" rx="3" fill="#fff" fill-opacity=".35"/>
    <circle cx="570" cy="394" r="14" fill="#10B981"/>
    <path d="M564 398c1 4 5 7 9 7l2-3-4-3-2 1c-2-1-3-2-4-4l1-2-3-4-3 2c0 2 1 4 4 6z" fill="#fff" transform="translate(0 -4)"/>
    <g fill="#34D399">
      <rect x="434" y="440" width="6" height="12" rx="3"/><rect x="446" y="432" width="6" height="28" rx="3"/>
      <rect x="458" y="424" width="6" height="44" rx="3"/><rect x="470" y="436" width="6" height="20" rx="3"/>
      <rect x="482" y="428" width="6" height="36" rx="3"/><rect x="494" y="438" width="6" height="16" rx="3"/>
      <rect x="506" y="432" width="6" height="28" rx="3"/><rect x="518" y="442" width="6" height="10" rx="3"/>
    </g>
    <rect x="540" y="438" width="38" height="16" rx="8" fill="#FBBF24"/>
  </g>

  <!-- link badge (green) -->
  <g transform="translate(510 112)">
    <circle r="32" fill="#10B981"/>
    <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
      <path d="M-4 6l-6 6a8 8 0 0 1-11-11l8-8a8 8 0 0 1 11 0"/>
      <path d="M4 -6l6-6a8 8 0 0 1 11 11l-8 8a8 8 0 0 1-11 0"/>
    </g>
  </g>

  <!-- network badge (blue) -->
  <g transform="translate(95 400)">
    <circle r="32" fill="#3B82F6"/>
    <g fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-7" y="-20" width="14" height="10" rx="2"/>
      <rect x="-22" y="10" width="12" height="10" rx="2"/>
      <rect x="10" y="10" width="12" height="10" rx="2"/>
      <path d="M0 -10v10M-16 10v-6h32v6"/>
    </g>
  </g>

  <!-- particles -->
  <g fill="#60A5FA"><circle cx="300" cy="48" r="4"/><circle cx="560" cy="250" r="3"/><circle cx="60" cy="280" r="3"/><circle cx="250" cy="520" r="4"/></g>
  <g fill="#34D399"><circle cx="430" cy="62" r="3"/><circle cx="610" cy="330" r="4"/><circle cx="170" cy="480" r="3"/><circle cx="40" cy="200" r="4"/></g>
  <g fill="#FBBF24"><circle cx="360" cy="520" r="3"/><circle cx="20" cy="340" r="3"/></g>
</svg>
