<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Four-step loop: smart dialer, CRM sync, campaign tracking and site visits" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text{font-family:Inter,'Segoe UI',system-ui,sans-serif}
    .lbl{font-size:19px;font-weight:700;fill:#fff}
    .sub{font-size:13px;fill:#9FB3D9}
    .chip{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle}
    .ink{fill:#DCE8FF}.badge{fill:#3B82F6}.blue{fill:#60A5FA}.amber{fill:#FBBF24}.green{fill:#34D399}.coral{fill:#F87171}
    .card{fill:#fff;fill-opacity:.07;stroke:#60A5FA;stroke-opacity:.38;stroke-width:1.5}
    .act{fill:none;stroke:#FBBF24;stroke-width:3.5;opacity:0;animation:act 8s ease-in-out infinite}
    .a2{animation-delay:2s}.a3{animation-delay:4s}.a4{animation-delay:6s}
    @keyframes act{0%{opacity:0}4%,22%{opacity:1}28%,100%{opacity:0}}
    .flow{stroke-dasharray:5 7;animation:flow 1.1s linear infinite;fill:none;stroke:#60A5FA;stroke-opacity:.65;stroke-width:3;stroke-linecap:round}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 2.2s ease-out infinite}
    .ring.r2{animation-delay:1.1s}
    @keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.2);opacity:0}}
    .wv{transform-box:fill-box;transform-origin:50% 50%;animation:wv 1.1s ease-in-out infinite}
    .wv:nth-child(2){animation-delay:.15s}.wv:nth-child(3){animation-delay:.3s}.wv:nth-child(4){animation-delay:.45s}.wv:nth-child(5){animation-delay:.6s}
    @keyframes wv{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
    .hl{animation:hl 8s ease-in-out infinite}
    @keyframes hl{0%,28%{transform:translateY(0)}34%,40%{transform:translateY(30px)}46%,58%{transform:translateY(60px)}70%,100%{transform:translateY(0)}}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 8s cubic-bezier(.3,.8,.3,1) infinite}
    .b2{animation-delay:.1s}.b3{animation-delay:.2s}.b4{animation-delay:.3s}.b5{animation-delay:.4s}
    @keyframes bar{0%,46%{transform:scaleY(.12)}58%,92%{transform:scaleY(1)}98%,100%{transform:scaleY(.12)}}
    .trend{fill:none;stroke:#F87171;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:200;stroke-dashoffset:200;animation:trend 8s ease-in-out infinite}
    @keyframes trend{0%,52%{stroke-dashoffset:200}66%,92%{stroke-dashoffset:0}98%,100%{stroke-dashoffset:200}}
    .up{transform-box:fill-box;transform-origin:50% 50%;animation:up 8s ease-out infinite}
    @keyframes up{0%,62%{transform:scale(0)}70%{transform:scale(1.2)}74%,92%{transform:scale(1)}98%,100%{transform:scale(0)}}
    .sel{transform-box:fill-box;transform-origin:50% 50%;animation:sel 8s ease-out infinite}
    @keyframes sel{0%,70%{transform:scale(0)}78%{transform:scale(1.2)}82%,96%{transform:scale(1)}100%{transform:scale(0)}}
    .drop{animation:drop 8s ease-in infinite}
    @keyframes drop{0%,72%{transform:translateY(-70px);opacity:0}80%{transform:translateY(0);opacity:1}84%{transform:translateY(-10px)}88%{transform:translateY(0)}96%{opacity:1}100%{transform:translateY(0);opacity:0}}
    .pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 8s ease-out infinite}
    @keyframes pulse{0%,79%{transform:scale(.2);opacity:0}82%{opacity:.6}98%,100%{transform:scale(2.4);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.act{opacity:0}.trend{stroke-dashoffset:0}.sel,.up{transform:none}.drop{opacity:1}}
  </style>


  <defs><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3B82F6" stop-opacity=".30"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient></defs>
  <ellipse cx="300" cy="270" rx="300" ry="270" fill="url(#gl)"/>
  <!-- flow arrows (clockwise loop) -->
  <path class="flow" d="M274 140 L322 140"/><path class="ink" fill-opacity=".55" d="M330 140 l-10 -7 v14z"/>
  <path class="flow" d="M450 244 L450 290"/><path class="ink" fill-opacity=".55" d="M450 298 l-7 -10 h14z"/>
  <path class="flow" d="M326 400 L278 400"/><path class="ink" fill-opacity=".55" d="M270 400 l10 -7 v14z"/>
  <path class="flow" d="M150 296 L150 250"/><path class="ink" fill-opacity=".55" d="M150 242 l-7 10 h14z"/>

  <!-- 1 · Smart dialer -->
  <g transform="translate(30 40)">
    <rect class="card" width="240" height="200" rx="18"/>
    <circle cx="36" cy="38" r="22" class="badge"/>
    <path transform="translate(23 25) scale(1.08)" fill="#fff" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
    <text class="lbl" x="70" y="38">Smart dialer</text>
    <text class="sub" x="70" y="58">Auto-call every lead</text>
    <circle cx="50" cy="135" r="22" class="amber"/>
    <circle cx="50" cy="128" r="7" fill="#0B1F4A"/>
    <path d="M36 151 a14 12 0 0 1 28 0z" fill="#0B1F4A"/>
    <g class="blue">
      <rect class="wv" x="92" y="115" width="8" height="40" rx="4"/><rect class="wv" x="108" y="115" width="8" height="40" rx="4"/><rect class="wv" x="124" y="115" width="8" height="40" rx="4"/><rect class="wv" x="140" y="115" width="8" height="40" rx="4"/><rect class="wv" x="156" y="115" width="8" height="40" rx="4"/>
    </g>
    <circle class="ring green" cx="202" cy="135" r="20" fill-opacity=".55"/>
    <circle class="ring r2 green" cx="202" cy="135" r="20" fill-opacity=".55"/>
    <circle cx="202" cy="135" r="20" class="green"/>
    <path transform="translate(192 125) scale(.85)" fill="#fff" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
    <rect class="act" x="0" y="0" width="240" height="200" rx="18"/>
  </g>

  <!-- 2 · CRM -->
  <g transform="translate(330 40)">
    <rect class="card" width="240" height="200" rx="18"/>
    <circle cx="36" cy="38" r="22" class="badge"/>
    <path transform="translate(23 25) scale(1.08)" fill="#fff" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
    <text class="lbl" x="70" y="38">CRM sync</text>
    <text class="sub" x="70" y="58">All leads, one place</text>
    <rect class="hl amber" x="14" y="91" width="212" height="28" rx="9" fill-opacity=".25"/>
    <circle cx="34" cy="105" r="9" class="ink"/><rect x="52" y="101" width="80" height="7" rx="3.5" class="ink"/>
    <rect x="158" y="95" width="56" height="20" rx="10" class="badge"/><text class="chip" x="186" y="109">New</text>
    <circle cx="34" cy="135" r="9" class="blue"/><rect x="52" y="131" width="68" height="7" rx="3.5" class="ink"/>
    <rect x="158" y="125" width="56" height="20" rx="10" fill="#EF4444"/><text class="chip" x="186" y="139">Hot</text>
    <circle cx="34" cy="165" r="9" class="amber"/><rect x="52" y="161" width="90" height="7" rx="3.5" class="ink"/>
    <rect x="158" y="155" width="56" height="20" rx="10" fill="#10B981"/><text class="chip" x="186" y="169">Won</text>
    <rect class="act a2" x="0" y="0" width="240" height="200" rx="18"/>
  </g>

  <!-- 3 · Campaigns -->
  <g transform="translate(330 300)">
    <rect class="card" width="240" height="200" rx="18"/>
    <circle cx="36" cy="38" r="22" class="badge"/>
    <g transform="translate(23 25) scale(1.08)" fill="#fff"><rect x="4" y="13" width="4" height="7" rx="1"/><rect x="10" y="8" width="4" height="12" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/></g>
    <text class="lbl" x="70" y="38">Campaigns</text>
    <text class="sub" x="70" y="58">See what's working</text>
    <line x1="28" y1="178" x2="212" y2="178" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
    <rect class="bar blue" x="40" y="148" width="22" height="30" rx="5"/>
    <rect class="bar b2 blue" x="74" y="130" width="22" height="48" rx="5"/>
    <rect class="bar b3 blue" x="108" y="136" width="22" height="42" rx="5"/>
    <rect class="bar b4 blue" x="142" y="108" width="22" height="70" rx="5"/>
    <rect class="bar b5 amber" x="176" y="90" width="22" height="88" rx="5"/>
    <polyline class="trend" points="51,136 85,118 119,124 153,96 187,78"/>
    <g class="up"><circle cx="214" cy="100" r="13" class="green"/><path d="M214 92 l7 9 h-14z" fill="#fff"/></g>
    <rect class="act a3" x="0" y="0" width="240" height="200" rx="18"/>
  </g>

  <!-- 4 · Site visits -->
  <g transform="translate(30 300)">
    <rect class="card" width="240" height="200" rx="18"/>
    <circle cx="36" cy="38" r="22" class="badge"/>
    <path transform="translate(23 25) scale(1.08)" fill="#fff" fill-rule="evenodd" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    <text class="lbl" x="70" y="38">Site visits</text>
    <text class="sub" x="70" y="58">Book and track visits</text>
    <rect x="14" y="92" width="110" height="86" rx="10" fill="#fff" fill-opacity=".06" stroke="#60A5FA" stroke-opacity=".38" stroke-width="1.5"/>
    <rect x="14" y="92" width="110" height="22" rx="10" class="amber"/><rect x="14" y="104" width="110" height="10" class="amber"/>
    <g class="blue">
      <circle cx="34" cy="130" r="4.5"/><circle cx="58" cy="130" r="4.5"/><circle cx="82" cy="130" r="4.5"/><circle cx="106" cy="130" r="4.5"/>
      <circle cx="34" cy="148" r="4.5"/><circle cx="58" cy="148" r="4.5"/><circle cx="106" cy="148" r="4.5"/>
      <circle cx="34" cy="166" r="4.5"/><circle cx="58" cy="166" r="4.5"/><circle cx="82" cy="166" r="4.5"/><circle cx="106" cy="166" r="4.5"/>
    </g>
    <circle class="sel coral" cx="82" cy="148" r="9"/>
    <path d="M77.5 148.5 l3.3 3.3 6-6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sel"/>
    <polygon points="156,152 190,126 224,152" class="blue"/>
    <rect x="164" y="150" width="52" height="28" rx="3" class="ink"/>
    <rect x="184" y="160" width="12" height="18" rx="2" class="amber"/>
    <ellipse class="pulse coral" cx="190" cy="128" rx="14" ry="5" fill-opacity=".5"/>
    <g transform="translate(190 128)"><g class="drop"><path d="M0 0 L-9 -15 A11 11 0 1 1 9 -15 Z" class="coral"/><circle cx="0" cy="-22" r="4" fill="#fff"/></g></g>
    <rect class="act a4" x="0" y="0" width="240" height="200" rx="18"/>
  </g>
</svg>
