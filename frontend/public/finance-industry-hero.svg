<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Secure cloud voice for finance</title>
<desc id="d">Animated: customers and borrowers connect over encrypted links to cloud servers and on to a bank or NBFC, with encrypted call logging and automated collections.</desc>
