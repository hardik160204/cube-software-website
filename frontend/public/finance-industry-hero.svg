.lbl{font-size:15px;fill:#DCEBF5;font-weight:600}
.chip{font-size:12px;font-weight:700;fill:#0A1F3D}
.line{fill:none;stroke:#5EEAD4;stroke-opacity:.4;stroke-width:2;stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.ring{fill:none;stroke:#5EEAD4;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite;opacity:0}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 1.1s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.scan{animation:scan 3.5s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(100px)}}
.type{animation:fade 4s ease-in-out infinite}
@keyframes fade{0%,15%{opacity:0}30%,85%{opacity:1}100%{opacity:0}}
.tick{stroke-dasharray:40;stroke-dashoffset:40;animation:tick 4s ease-in-out infinite}
@keyframes tick{0%,20%{stroke-dashoffset:40}40%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:40}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
