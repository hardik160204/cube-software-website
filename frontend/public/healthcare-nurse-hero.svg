<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 170 680 360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Patient-first communication for healthcare</title>
<desc>Animated illustration: a patient phone connects through cloud telephony to a hospital with a waving nurse, with a heartbeat line and cards for reminders, emergency routing and 24/7 helpdesk.</desc>
<style>
text{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:600;fill:#FFFFFF}
.ts{font-size:12px;font-weight:500;fill:#9FB3D9}
</style>
<defs>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3B82F6" stop-opacity=".35"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
<linearGradient id="ecg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
</defs>

<ellipse cx="340" cy="300" rx="330" ry="150" fill="url(#glow)"/>

<!-- ring waves -->
<g stroke="#34D399" stroke-width="2.5" fill="none" stroke-linecap="round">
<path d="M150 250 q10 15 0 30"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" begin="0s" repeatCount="indefinite"/></path>
<path d="M160 242 q14 23 0 46"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></path>
<path d="M170 234 q18 31 0 62"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></path>
</g>

<!-- patient phone -->
<g>
<animateTransform attributeName="transform" type="rotate" values="0 110 265;-5 110 265;5 110 265;-5 110 265;5 110 265;0 110 265;0 110 265" keyTimes="0;0.06;0.12;0.18;0.24;0.3;1" dur="3s" repeatCount="indefinite"/>
<rect x="85" y="220" width="50" height="90" rx="10" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.85" stroke-width="1.5"/>
<rect x="92" y="232" width="36" height="56" rx="4" fill="#0B1F4A" fill-opacity="0.85"/>
<circle cx="110" cy="299" r="4" fill="#34D399"/>
<path d="M100 252 h20 M100 262 h14 M100 272 h18" stroke="#34D399" stroke-width="2" stroke-linecap="round" fill="none"/>
</g>
<text class="ts" x="110" y="338" text-anchor="middle">Patients</text>

<!-- connections -->
<line x1="188" y1="262" x2="284" y2="262" stroke="#34D399" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-9" dur="0.6s" repeatCount="indefinite"/></line>
<line x1="406" y1="262" x2="488" y2="262" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-9" dur="0.6s" repeatCount="indefinite"/></line>
<circle r="4.5" fill="#34D399"><animateMotion path="M188 262 L284 262" dur="1.6s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#60A5FA"><animateMotion path="M406 262 L488 262" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#F87171"><animateMotion path="M406 262 L488 262" dur="1.6s" begin="0s" repeatCount="indefinite"/></circle>

<!-- cloud telephony -->
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4s" repeatCount="indefinite"/>
<g fill="#1E3F8F" stroke="#60A5FA" stroke-width="3">
<circle cx="310" cy="252" r="24"/><circle cx="345" cy="235" r="32"/><circle cx="380" cy="255" r="24"/><rect x="310" y="252" width="70" height="24"/>
</g>
<g fill="#1E3F8F">
<circle cx="310" cy="252" r="24"/><circle cx="345" cy="235" r="32"/><circle cx="380" cy="255" r="24"/><rect x="310" y="252" width="70" height="24"/>
</g>
<text class="th" x="345" y="244" text-anchor="middle">Cloud</text>
<text class="ts" x="345" y="262" text-anchor="middle" style="fill:#BFD7FF">telephony</text>
</g>

<!-- hospital -->
<circle cx="545" cy="243" r="14" fill="none" stroke="#F87171" stroke-width="1.5"><animate attributeName="r" values="14;34" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/></circle>
<rect x="490" y="215" width="110" height="100" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#60A5FA" stroke-opacity="0.55" stroke-width="1.5"/>
<g fill="#F87171"><rect x="538" y="229" width="14" height="28" rx="2"/><rect x="531" y="236" width="28" height="14" rx="2"/><animate attributeName="opacity" values="1;0.55;1" dur="1.2s" repeatCount="indefinite"/></g>
<g fill="#9FC4FF" fill-opacity="0.65"><rect x="502" y="266" width="14" height="14" rx="2"/><rect x="524" y="266" width="14" height="14" rx="2"/><rect x="546" y="266" width="14" height="14" rx="2"/><rect x="568" y="266" width="14" height="14" rx="2"/></g>
<rect x="535" y="293" width="20" height="22" rx="2" fill="#60A5FA" fill-opacity="0.5"/>
<text class="ts" x="545" y="338" text-anchor="middle">Hospital</text>

<!-- nurse -->
<ellipse cx="632" cy="318" rx="22" ry="3.5" fill="#000" opacity="0.3"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2s" repeatCount="indefinite"/>
<line x1="616" y1="256" x2="612" y2="289" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
<circle cx="612" cy="294" r="4" fill="#F5C9A6"/>
<rect x="614" y="247" width="36" height="68" rx="12" fill="#10B981"/>
<path d="M625 247 L632 258 L639 247 Z" fill="#FFFFFF"/>
<path d="M626 250 q-4 14 2 20 q6 4 10 -2" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="638" cy="267" r="2.5" fill="#CBD5E1"/>
<rect x="640" y="276" width="7" height="9" rx="1.5" fill="#FFFFFF"/>
<g>
<animateTransform attributeName="transform" type="rotate" values="0 648 254;-25 648 254;10 648 254;-25 648 254;0 648 254" dur="1.6s" repeatCount="indefinite"/>
<line x1="648" y1="254" x2="660" y2="236" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
<circle cx="660" cy="232" r="4" fill="#F5C9A6"/>
</g>
<rect x="628" y="243" width="8" height="5" fill="#F5C9A6"/>
<circle cx="632" cy="232" r="13" fill="#F5C9A6"/>
<path d="M619 231 a13 13 0 0 1 26 0 q-6 -7 -13 -7 q-7 0 -13 7 z" fill="#9A6B47"/>
<rect x="624" y="213" width="16" height="9" rx="2" fill="#FFFFFF" stroke="#9FB3D9" stroke-width="0.8"/>
<g fill="#F87171"><rect x="631" y="214.5" width="2" height="6"/><rect x="629" y="216.5" width="6" height="2"/></g>
<circle cx="627" cy="233" r="1.3" fill="#2C2C2A"/>
<circle cx="637" cy="233" r="1.3" fill="#2C2C2A"/>
<path d="M628 238 q4 3 8 0" fill="none" stroke="#A32D2D" stroke-width="1.2" stroke-linecap="round"/>
<path d="M618 232 a14 14 0 0 1 28 0" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
<circle cx="618" cy="234" r="3" fill="#60A5FA"/>
<circle cx="646" cy="234" r="3" fill="#60A5FA"/>
<path d="M646 237 q0 8 -8 9" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="638" cy="246" r="2" fill="#60A5FA"/>
</g>
<text class="ts" x="632" y="338" text-anchor="middle">Nurse</text>

<!-- heartbeat -->
<path d="M40 372 H600" fill="none" stroke="#34D399" stroke-width="1" opacity="0.25"/>
<path d="M40 372 H150 l10 -16 l14 32 l10 -16 H300 l10 -22 l14 44 l10 -22 H470 l10 -16 l14 32 l10 -16 H640" fill="none" stroke="url(#ecg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="22 78"><animate attributeName="stroke-dashoffset" from="22" to="-78" dur="2.4s" repeatCount="indefinite"/></path>

<!-- card: reminders -->
<rect x="40" y="406" width="190" height="104" rx="12" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.6" stroke-width="1.2"/>
<text class="th" x="135" y="470" text-anchor="middle">Patient reminders</text>
<text class="ts" x="135" y="490" text-anchor="middle">Automated calls and SMS</text>
<circle cx="135" cy="436" r="18" fill="#0B1F4A" fill-opacity="0.85" stroke="#34D399" stroke-opacity="0.6"/>
<g transform="translate(135 436)" stroke="#34D399" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
<animateTransform attributeName="transform" type="rotate" values="0 135 428;-14 135 428;14 135 428;-14 135 428;0 135 428;0 135 428" keyTimes="0;0.1;0.2;0.3;0.4;1" dur="2.5s" additive="sum" repeatCount="indefinite"/>
<path d="M-8 6 v-6 a8 8 0 0 1 16 0 v6 l3 3 h-22 z"/>
<circle cx="0" cy="12" r="2" fill="#34D399"/>
</g>

<!-- card: emergency -->
<rect x="245" y="406" width="190" height="104" rx="12" fill="#F87171" fill-opacity="0.10" stroke="#F87171" stroke-opacity="0.6" stroke-width="1.2"/>
<text class="th" x="340" y="470" text-anchor="middle">Emergency routing</text>
<text class="ts" x="340" y="490" text-anchor="middle">Urgent calls reach staff</text>
<circle cx="340" cy="436" r="18" fill="#0B1F4A" fill-opacity="0.85" stroke="#F87171" stroke-opacity="0.6"/>
<circle cx="332" cy="444" r="3" fill="#F87171"/>
<circle cx="332" cy="444" r="3" fill="none" stroke="#F87171" stroke-width="1.5"><animate attributeName="r" values="3;13" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.4s" repeatCount="indefinite"/></circle>
<path d="M335 444 H340 L348 432 M343 430 H350 V437" fill="none" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

<!-- card: helpdesk -->
<rect x="450" y="406" width="190" height="104" rx="12" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.6" stroke-width="1.2"/>
<text class="th" x="545" y="470" text-anchor="middle">Helpdesk 24/7</text>
<text class="ts" x="545" y="490" text-anchor="middle">Always-on hospital support</text>
<circle cx="545" cy="436" r="18" fill="#0B1F4A" fill-opacity="0.85" stroke="#60A5FA" stroke-opacity="0.6"/>
<circle cx="545" cy="436" r="11" fill="none" stroke="#60A5FA" stroke-width="1.8"/>
<line x1="545" y1="436" x2="550" y2="436" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round"/>
<line x1="545" y1="436" x2="545" y2="428" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 545 436" to="360 545 436" dur="6s" repeatCount="indefinite"/></line>
</svg>
