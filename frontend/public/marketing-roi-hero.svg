<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 800 480" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Missed call to lead to ROI, with voice broadcast" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3B82F6" stop-opacity=".34"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="barg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <style>
    .float{animation:float 4s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-8px)}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
    @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}
    .shake{transform-box:fill-box;transform-origin:center;animation:shake 2s ease-in-out infinite}
    @keyframes shake{0%,50%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}
    .dash{stroke-dasharray:6 6;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 4s ease-in-out infinite}
    @keyframes grow{0%{transform:scaleY(0)}30%,88%{transform:scaleY(1)}100%{transform:scaleY(0)}}
    .trend{stroke-dasharray:300;animation:draw 4s ease-in-out infinite}
    @keyframes draw{0%,20%{stroke-dashoffset:300}60%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:300}}
    .head{animation:fade 4s ease-in-out infinite}
    @keyframes fade{0%,55%{opacity:0}65%,88%{opacity:1}100%{opacity:0}}
    .wave{animation:wave 1.5s ease-in-out infinite}
    @keyframes wave{0%,100%{opacity:.1}50%{opacity:1}}
    .person{animation:lit 3s ease-in-out infinite;fill:#9FB3D9}
    @keyframes lit{0%,100%{fill:#9FB3D9}20%,45%{fill:#34D399}}
    .pop{transform-box:fill-box;transform-origin:center;animation:pop 2.4s ease-in-out infinite}
    @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
    .blink{animation:blink 1.2s steps(2,start) infinite}
    @keyframes blink{50%{opacity:.2}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <ellipse cx="400" cy="265" rx="400" ry="250" fill="url(#gl)"/>

  <!-- Virtual number card -->
  <g class="float" style="animation-delay:-1s">
    <rect x="30" y="110" width="240" height="104" rx="18" fill="url(#card)" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
    <circle cx="58" cy="136" r="6" fill="#22C55E" class="blink"/>
    <text x="72" y="140" font-size="13" fill="#fff" opacity=".9">Virtual Number</text>
    <text x="50" y="186" font-size="20" font-weight="700" fill="#fff" textLength="190" lengthAdjust="spacingAndGlyphs">+91 98XXX XXXXX</text>
  </g>
  <line x1="272" y1="162" x2="322" y2="162" stroke="#38BDF8" stroke-width="3" class="dash"/>

  <!-- Phone -->
  <g class="float">
    <rect x="320" y="50" width="160" height="320" rx="28" fill="none" stroke="#818CF8" stroke-width="6"/>
    <rect x="332" y="78" width="136" height="264" rx="14" fill="#fff" opacity=".07"/>
    <rect x="372" y="62" width="56" height="6" rx="3" fill="#818CF8"/>

    <!-- Missed call -->
    <circle class="ring" cx="400" cy="150" r="30" fill="#EF4444"/>
    <circle cx="400" cy="150" r="30" fill="#EF4444"/>
    <g class="shake">
      <path transform="translate(380.4,130.4) scale(1.63)" fill="#fff" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
    </g>
    <path d="M414 134 L428 120 M428 130 L428 120 L418 120" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-8,6)"/>
    <text x="400" y="206" font-size="14" font-weight="700" fill="#F87171" text-anchor="middle">Missed Call</text>

    <!-- Flow to lead -->
    <line x1="400" y1="216" x2="400" y2="252" stroke="#22C55E" stroke-width="3" class="dash"/>

    <!-- Lead -->
    <g class="pop">
      <circle cx="400" cy="282" r="26" fill="#22C55E"/>
      <circle cx="400" cy="274" r="8" fill="#fff"/>
      <path d="M385 294 Q400 276 415 294 Z" fill="#fff"/>
      <circle cx="420" cy="262" r="9" fill="#fff"/>
      <path d="M415.5 262 l3 3 l6 -6" stroke="#22C55E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="400" y="328" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle">Lead</text>
  </g>

  <!-- ROI chart -->
  <line x1="530" y1="340" x2="770" y2="340" stroke="#60A5FA" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  <rect class="bar" x="548" y="280" width="36" height="60" rx="6" fill="url(#barg)" style="animation-delay:0s"/>
  <rect class="bar" x="598" y="240" width="36" height="100" rx="6" fill="url(#barg)" style="animation-delay:.15s"/>
  <rect class="bar" x="648" y="190" width="36" height="150" rx="6" fill="url(#barg)" style="animation-delay:.3s"/>
  <rect class="bar" x="698" y="140" width="36" height="200" rx="6" fill="url(#barg)" style="animation-delay:.45s"/>
  <polyline class="trend" points="566,255 616,215 666,165 716,105" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon class="head" points="716,92 732,116 704,114" fill="#F59E0B" transform="rotate(8 716 105)"/>
  <text x="650" y="64" font-size="30" font-weight="800" fill="#34D399" text-anchor="middle">ROI ↑</text>

  <!-- Voice broadcast -->
  <path d="M50 425 H88 L134 398 V472 L88 445 H50 Z" fill="#818CF8"/>
  <rect x="62" y="445" width="16" height="26" rx="4" fill="#6366F1"/>
  <path class="wave" d="M148 420 Q164 435 148 450" stroke="#A5B4FC" stroke-width="4" fill="none" stroke-linecap="round" style="animation-delay:0s"/>
  <path class="wave" d="M160 408 Q184 435 160 462" stroke="#A5B4FC" stroke-width="4" fill="none" stroke-linecap="round" style="animation-delay:.25s"/>
  <path class="wave" d="M172 396 Q204 435 172 474" stroke="#A5B4FC" stroke-width="4" fill="none" stroke-linecap="round" style="animation-delay:.5s"/>
  <line x1="215" y1="435" x2="270" y2="435" stroke="#A5B4FC" stroke-width="3" class="dash"/>

  <g>
    <circle class="person" cx="300" cy="420" r="9" style="animation-delay:0s"/><path class="person" d="M283 452 Q300 426 317 452 Z" style="animation-delay:0s"/>
    <circle class="person" cx="380" cy="420" r="9" style="animation-delay:.4s"/><path class="person" d="M363 452 Q380 426 397 452 Z" style="animation-delay:.4s"/>
    <circle class="person" cx="460" cy="420" r="9" style="animation-delay:.8s"/><path class="person" d="M443 452 Q460 426 477 452 Z" style="animation-delay:.8s"/>
    <circle class="person" cx="540" cy="420" r="9" style="animation-delay:1.2s"/><path class="person" d="M523 452 Q540 426 557 452 Z" style="animation-delay:1.2s"/>
    <circle class="person" cx="620" cy="420" r="9" style="animation-delay:1.6s"/><path class="person" d="M603 452 Q620 426 637 452 Z" style="animation-delay:1.6s"/>
  </g>
  <text x="460" y="485" font-size="14" font-weight="700" fill="#A5B4FC" text-anchor="middle">Voice Broadcast</text>
</svg>
