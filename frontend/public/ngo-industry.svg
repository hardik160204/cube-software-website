<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 800 540" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cloud telephony for awareness and fundraising: globe with headset, flight path, donation heart and 24/7 helpline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B9BFF"/><stop offset="1" stop-color="#1550B8"/></linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B81"/><stop offset="1" stop-color="#E11D48"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3B82F6" stop-opacity=".34"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <clipPath id="gclip"><circle cx="400" cy="330" r="130"/></clipPath>
    <path id="fp" d="M130 290 Q 400 -30 670 210"/>
    <g id="land" fill="#2DD4BF">
      <path d="M320 260 q30 -30 70 -10 q20 20 0 40 q-30 10 -40 40 q-30 10 -40 -20 q-10 -30 10 -50z"/>
      <path d="M420 300 q40 -20 70 10 q10 40 -20 60 q-20 40 -40 10 q-20 -30 -10 -80z"/>
      <path d="M440 230 q30 -10 40 10 q-10 20 -40 10z"/>
    </g>
  </defs>
  <style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

  <ellipse cx="400" cy="330" rx="400" ry="260" fill="url(#gl)"/>

  <!-- Flight path + plane -->
  <use href="#fp" fill="none" stroke="#FB923C" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="3s" repeatCount="indefinite"/></use>
  <circle cx="130" cy="290" r="8" fill="#FB923C"/>
  <circle cx="130" cy="290" r="8" fill="none" stroke="#FB923C" stroke-width="2"><animate attributeName="r" values="8;24" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/></circle>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="7s" repeatCount="indefinite"/>
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#fp"/></animateMotion>
    <path d="M0 -26 L8 -6 L34 8 L34 16 L8 10 L5 26 L14 32 L14 38 L0 34 L-14 38 L-14 32 L-5 26 L-8 10 L-34 16 L-34 8 L-8 -6 Z" fill="#FB923C" transform="scale(.8) rotate(90)"/>
  </g>

  <!-- Clouds -->
  <g fill="#BFD9FF" fill-opacity=".28" stroke="#BFD9FF" stroke-opacity=".5" stroke-width="1.5">
    <path d="M90 190 a22 22 0 0 1 40 -10 a26 26 0 0 1 48 8 a18 18 0 0 1 -4 36 h-76 a18 18 0 0 1 -8 -34z"><animateTransform attributeName="transform" type="translate" values="0 0;14 0;0 0" dur="7s" repeatCount="indefinite"/></path>
    <path d="M600 330 a16 16 0 0 1 30 -8 a20 20 0 0 1 36 6 a14 14 0 0 1 -3 28 h-58 a14 14 0 0 1 -5 -26z"><animateTransform attributeName="transform" type="translate" values="0 0;-12 0;0 0" dur="6s" repeatCount="indefinite"/></path>
  </g>

  <!-- Globe -->
  <circle cx="400" cy="330" r="130" fill="url(#globe)"/>
  <g clip-path="url(#gclip)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="260 0" dur="18s" repeatCount="indefinite"/>
      <use href="#land"/><use href="#land" x="-260"/>
    </g>
    <g fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2">
      <ellipse cx="400" cy="330" rx="60" ry="130"/><ellipse cx="400" cy="330" rx="110" ry="130"/>
      <line x1="270" y1="330" x2="530" y2="330"/>
      <path d="M278 270 Q400 295 522 270"/><path d="M278 390 Q400 365 522 390"/>
    </g>
  </g>
  <circle cx="400" cy="330" r="130" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>

  <!-- Pins -->
  <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.6s" repeatCount="indefinite"/>
    <path d="M352 300 c-16 -20 -16 -42 0 -42 s16 22 0 42z" transform="translate(0 6)" fill="#FB923C" stroke="#fff" stroke-width="3"/><circle cx="352" cy="270" r="5" fill="#fff"/></g>
  <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.6s" begin=".8s" repeatCount="indefinite"/>
    <path d="M462 372 c-16 -20 -16 -42 0 -42 s16 22 0 42z" transform="translate(0 6)" fill="#FB923C" stroke="#fff" stroke-width="3"/><circle cx="462" cy="342" r="5" fill="#fff"/></g>

  <!-- Headset -->
  <path d="M242 330 A158 178 0 0 1 558 330" fill="none" stroke="url(#band)" stroke-width="20" stroke-linecap="round"/>
  <rect x="216" y="296" width="46" height="96" rx="20" fill="url(#band)"/>
  <rect x="538" y="296" width="46" height="96" rx="20" fill="url(#band)"/>
  <rect x="226" y="312" width="14" height="64" rx="7" fill="#fff"><animate attributeName="opacity" values=".25;.7;.25" dur="1.6s" repeatCount="indefinite"/></rect>
  <rect x="560" y="312" width="14" height="64" rx="7" fill="#fff"><animate attributeName="opacity" values=".25;.7;.25" dur="1.6s" begin=".8s" repeatCount="indefinite"/></rect>
  <path d="M561 392 Q 555 470 470 478" fill="none" stroke="#818CF8" stroke-width="10" stroke-linecap="round"/>
  <rect x="440" y="466" width="40" height="24" rx="12" fill="#FB923C"/>
  <circle cx="460" cy="478" r="4" fill="#fff"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle>

  <!-- Sound waves -->
  <g fill="none" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round">
    <path d="M610 300 q18 28 0 56"><animate attributeName="opacity" values=".15;1;.15" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M632 282 q30 46 0 92"><animate attributeName="opacity" values=".15;1;.15" dur="1.6s" begin=".25s" repeatCount="indefinite"/></path>
    <path d="M654 264 q42 64 0 128"><animate attributeName="opacity" values=".15;1;.15" dur="1.6s" begin=".5s" repeatCount="indefinite"/></path>
  </g>

  <!-- Megaphone -->
  <g transform="translate(70 380) rotate(-12)">
    <g><animateTransform attributeName="transform" type="rotate" values="0;-4;0;3;0" dur="3s" repeatCount="indefinite"/>
      <path d="M0 20 h26 l62 -34 v100 l-62 -34 h-26z" fill="#2DD4BF"/>
      <rect x="-12" y="14" width="18" height="52" rx="6" fill="#818CF8"/>
      <path d="M16 62 l10 40 h22 l-8 -34z" fill="#818CF8"/>
      <path d="M100 6 q20 30 0 60" fill="none" stroke="#FB923C" stroke-width="6" stroke-linecap="round"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></path>
      <path d="M116 -6 q30 42 0 84" fill="none" stroke="#FB923C" stroke-width="6" stroke-linecap="round"><animate attributeName="opacity" values=".2;.7;.2" dur="1.4s" begin=".3s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <!-- Donation heart + coin -->
  <g transform="translate(620 440)">
    <g transform="translate(0 -6)"><g>
      <animateTransform attributeName="transform" type="scale" values="1;1.13;1;1.07;1" keyTimes="0;.2;.4;.55;1" dur="1.4s" repeatCount="indefinite"/>
      <g transform="translate(0 6)"><path d="M0 18 C-40 -20 -10 -50 0 -26 C10 -50 40 -20 0 18z" fill="url(#heart)" transform="scale(1.7)"/></g>
    </g></g>
    <g fill="#FF6B81">
      <g opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;-4 -60" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="3s" repeatCount="indefinite"/><path d="M0 18 C-40 -20 -10 -50 0 -26 C10 -50 40 -20 0 18z" transform="translate(-30 -40) scale(.25)"/></g>
      <g opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;6 -60" dur="3s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="3s" begin="1.5s" repeatCount="indefinite"/><path d="M0 18 C-40 -20 -10 -50 0 -26 C10 -50 40 -20 0 18z" transform="translate(-10 -50) scale(.2)"/></g>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2s" repeatCount="indefinite"/>
      <circle cx="48" cy="-40" r="24" fill="#FBBF24" stroke="#F59E0B" stroke-width="4"/>
      <text x="48" y="-31" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#B45309">₹</text>
    </g>
  </g>

  <!-- Helpline bubble -->
  <g transform="translate(60 60)">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.5s" repeatCount="indefinite"/>
      <path d="M20 0 h170 a20 20 0 0 1 20 20 v40 a20 20 0 0 1 -20 20 h-120 l-26 22 v-22 h-24 a20 20 0 0 1 -20 -20 v-40 a20 20 0 0 1 20 -20z" fill="#fff" fill-opacity=".09" stroke="#2DD4BF" stroke-opacity=".8" stroke-width="2.5" stroke-linejoin="round"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0 40 40;-12 40 40;12 40 40;-8 40 40;0 40 40;0 40 40" keyTimes="0;.1;.2;.3;.4;1" dur="2.4s" repeatCount="indefinite"/>
        <path d="M38 52 q-6 -22 8 -30 l8 10 -6 6 q2 8 10 14 l6 -6 10 8 q-10 16 -36 -2z" fill="#2DD4BF" transform="translate(-4 -2) scale(.9)"/></g>
      <text x="76" y="47" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#fff" textLength="116" lengthAdjust="spacingAndGlyphs">24/7 Helpline</text>
    </g>
  </g>

  <!-- Donate tag -->
  <g transform="translate(288 515)">
    <rect width="224" height="46" rx="23" fill="#E11D48"/>
    <rect width="224" height="46" rx="23" fill="none" stroke="#FF6B81" stroke-width="2"><animate attributeName="stroke-opacity" values=".9;0;.9" dur="1.8s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="2;8;2" dur="1.8s" repeatCount="indefinite"/></rect>
    <text x="112" y="30" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#fff" textLength="170" lengthAdjust="spacingAndGlyphs">Donate • Connect</text>
  </g>
</svg>
