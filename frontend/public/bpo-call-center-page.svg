<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 600" width="540" height="600" font-family="'Segoe UI', Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><style>
    .bar{transform-box:fill-box;transform-origin:center;animation:wave 1.4s ease-in-out infinite}
    @keyframes wave{0%,100%{transform:scaleY(0.25)}50%{transform:scaleY(1.15)}}
    .rec{animation:blink 1s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  </style>
  
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1437"/>
      <stop offset="1" stop-color="#1E2F7A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="540" height="600" rx="32" fill="url(#bg)"/>
